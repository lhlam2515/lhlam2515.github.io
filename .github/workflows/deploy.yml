name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Chỉ một lần deploy chạy tại một thời điểm; không huỷ lần đang chạy để tránh deploy dở dang
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Lấy origin của site từ Settings → Pages (github.io hoặc custom domain)
      - name: Read Pages settings
        id: pages
        uses: actions/configure-pages@v6

      # Chạy script `build` trong package.json: astro check → astro build (kèm
      # kiểm tra link nội bộ), rồi upload artifact cho Pages
      - name: Install, check, build, and upload
        uses: withastro/action@v6
        with:
          package-manager: pnpm@12.6.0
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
